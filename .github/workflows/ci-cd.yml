name: CI/CD - Enfoque

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Instalar versiones del lockfile
        run: npm ci
      - name: Ejecutar pruebas unitarias e integración (cobertura mínima 90 %)
        run: npm run test:coverage
      - name: Conservar informe de cobertura
        if: ${{ always() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: error

  build:
    name: Build de producción
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Instalar versiones del lockfile
        run: npm ci
      - name: Compilar aplicación
        run: npm run build
      - name: Conservar build verificable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-build
          path: dist/
          retention-days: 14
          if-no-files-found: error
      - name: Preparar artefacto de GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/

  deploy:
    name: Desplegar en GitHub Pages
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Publicar el artefacto compilado
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
